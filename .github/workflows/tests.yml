name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: python -m pip install -r research/requirements.txt
      - run: python research/test_reference.py
      - run: python research/test_analysis.py
      - name: Check independent reference reproducibility
        run: |
          python research/reference.py
          git diff --exit-code -- research/results/reference.json
      - name: Check recorded comparison consistency
        run: |
          python research/analyze.py
          python research/analyze.py --input research/results/refinement-gpu.json --output research/results/refinement-analysis.json
          python research/analyze-stress.py
          python research/analyze-transport.py
          python research/check-evidence.py
          git diff --exit-code -- research/results/analysis.json research/results/refinement-analysis.json research/results/stress-analysis.json research/results/stress-transport-analysis.json
      - run: npm run build:site
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Save browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
